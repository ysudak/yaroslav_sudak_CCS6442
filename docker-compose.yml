services:
  app:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres/${DATABASE_NAME}
    env_file:
      - .env
    depends_on:
      - postgres
  postgres:
    image: postgres:11.5-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data:cached
  checkstatus:
    build:
      context: ./src
      dockerfile: Production-Dockerfile
    depends_on:
      - postgres
